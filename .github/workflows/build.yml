name: Build APK GlucoCris

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: glucocris-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # Nome FIXO do zip com o projeto. So e usado se a raiz do repositorio NAO tiver settings.gradle(.kts).
  # (O repositorio tem dezenas de zips antigos; procurar "qualquer zip" compilava versao errada.)
  PROJECT_ZIP: GlucoCris_BUILD.zip
  EXPECTED_APPLICATION_ID: com.agon.app

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. Descobrir a raiz REAL do projeto (sem adivinhar qual zip usar)
      - name: Localizar projeto GlucoCris
        shell: bash
        run: |
          set -euo pipefail
          if [ -f settings.gradle.kts ] || [ -f settings.gradle ]; then
            PROJECT_DIR="."
            echo "Projeto na raiz do repositorio."
          else
            if [ ! -f "$PROJECT_ZIP" ]; then
              echo "::error::Nao ha settings.gradle(.kts) na raiz e o arquivo '$PROJECT_ZIP' nao existe no repositorio. Envie o zip com esse nome exato (ou extraia o projeto na raiz)."
              ls -la
              exit 1
            fi
            echo "Extraindo: $PROJECT_ZIP ($(du -h "$PROJECT_ZIP" | cut -f1), md5 $(md5sum "$PROJECT_ZIP" | cut -d' ' -f1))"
            rm -rf .build-source && mkdir .build-source
            unzip -oq "$PROJECT_ZIP" -d .build-source
            SETTINGS=$(find .build-source -maxdepth 3 -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)
            if [ -z "$SETTINGS" ]; then
              echo "::error::'$PROJECT_ZIP' nao contem settings.gradle(.kts)."
              exit 1
            fi
            PROJECT_DIR=$(dirname "$SETTINGS")
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "=== Projeto: $PROJECT_DIR ==="
          ls -la "$PROJECT_DIR"
          test -f "$PROJECT_DIR/app/build.gradle.kts" || { echo "::error::app/build.gradle.kts ausente"; exit 1; }
          echo "=== Versoes que serao compiladas (prova de qual codigo esta sendo usado) ==="
          grep -nE "compose-bom|versionCode|versionName|compileSdk|applicationId|abiFilters" "$PROJECT_DIR/app/build.gradle.kts"
          grep -nE "kotlin\"\) version|com.android.application" "$PROJECT_DIR/build.gradle.kts"
          if grep -qE "compose-bom:2026\.(08|09|1[0-9])" "$PROJECT_DIR/app/build.gradle.kts"; then
            echo "::error::Compose BOM >= 2026.08 (Compose 1.12) exige compileSdk 37 e AGP 9. Use compose-bom:2026.04.01 com AGP 8.x/compileSdk 36."
            exit 1
          fi

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 2. SDK: o runner ubuntu-24.04 ja traz o Android SDK (ANDROID_HOME).
      #    NAO usar android-actions/setup-android (quebra com sdkmanager 16: "Failed to find package 'tools'").
      - name: Preparar Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          fi
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt2"
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"

      # 3. Gradle (mesma versao do wrapper do projeto)
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-disabled: true

      # 4. Compilar (falha de verdade se o Gradle falhar; sem continue-on-error)
      - name: Compilar GlucoCris
        id: build
        shell: bash
        env:
          TAVILY_PROXY_URL: ${{ secrets.TAVILY_PROXY_URL }}
          TAVILY_APP_TOKEN: ${{ secrets.TAVILY_APP_TOKEN }}
        run: |
          set -o pipefail
          gradle --version
          gradle -p "$PROJECT_DIR" :app:assembleDebug \
            --stacktrace --console=plain --no-daemon \
            "-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8" \
            2>&1 | tee build.log

      # 5. Mostrar o erro REAL (anotacoes vermelhas no topo da execucao)
      - name: Resumo do erro
        if: failure() && steps.build.outcome == 'failure'
        shell: bash
        run: |
          echo "========== ERROS REAIS DO BUILD =========="
          grep -E '^e: |What went wrong|Execution failed|Caused by:|Could not |Duplicate class|Manifest merger|AAPT|error:' build.log \
            | grep -v '^\s*at ' | sort -u | head -n 40 | tee errors.txt || true
          echo "=========================================="
          while IFS= read -r line; do echo "::error::${line:0:400}"; done < <(head -n 10 errors.txt)
          { echo "## Erro na compilacao"; echo '```'; cat errors.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Enviar log de build
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      # 6. Validar o APK de verdade (qualquer falha aqui reprova o build)
      - name: Validar APK
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -type f -name "*.apk" | head -n 1)
          [ -n "$APK" ] || { echo "::error::Nenhum APK gerado"; exit 1; }
          SIZE=$(stat -c %s "$APK")
          echo "APK: $APK ($SIZE bytes)"
          [ "$SIZE" -gt 5000000 ] || { echo "::error::APK suspeito (menor que 5 MB)"; exit 1; }
          unzip -tq "$APK"
          "$BT/apksigner" verify --verbose "$APK" | head -n 8
          "$BT/aapt2" dump badging "$APK" > badging.txt
          PKG=$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" badging.txt)
          VCODE=$(sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" badging.txt | head -n 1)
          VNAME=$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" badging.txt | head -n 1)
          ABIS=$(sed -n "s/^native-code: //p" badging.txt)
          echo "applicationId=$PKG versionCode=$VCODE versionName=$VNAME abis=$ABIS"
          [ "$PKG" = "$EXPECTED_APPLICATION_ID" ] || { echo "::error::applicationId inesperado: $PKG"; exit 1; }
          [ -n "$VNAME" ] || { echo "::error::versionName vazio"; exit 1; }
          mkdir -p dist
          cp "$APK" "dist/GlucoCris-universal-v${VNAME}-build${GITHUB_RUN_NUMBER}.apk"
          cp "$APK" "dist/GlucoCris-universal-latest.apk"
          echo "VERSION=$VNAME" >> "$GITHUB_ENV"
          {
            echo "## APK gerado e validado"
            echo "| Campo | Valor |"; echo "|---|---|"
            echo "| Arquivo | GlucoCris-universal-v${VNAME}-build${GITHUB_RUN_NUMBER}.apk |"
            echo "| Tamanho | $(du -h "$APK" | cut -f1) ($SIZE bytes) |"
            echo "| applicationId | $PKG |"
            echo "| versionName / versionCode | $VNAME / $VCODE |"
            echo "| ABIs | $ABIS |"
            echo "| SHA-256 | $(sha256sum "$APK" | cut -d' ' -f1) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlucoCris-universal-v${{ env.VERSION }}-build${{ github.run_number }}
          path: dist/GlucoCris-universal-v*.apk
          if-no-files-found: error
          retention-days: 30

      # 7. Releases: um por build (historico) + "apk-mais-recente" (link fixo). Sem continue-on-error.
      - name: Publicar APK em Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}-build${GITHUB_RUN_NUMBER}"
          VERSIONED="dist/GlucoCris-universal-v${VERSION}-build${GITHUB_RUN_NUMBER}.apk"
          LATEST="dist/GlucoCris-universal-latest.apk"

          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$VERSIONED" --clobber
          else
            gh release create "$TAG" "$VERSIONED" \
              --title "Gluco Cris v${VERSION} (build ${GITHUB_RUN_NUMBER})" \
              --notes "APK universal (arm64-v8a + x86_64). Instala por cima da versao anterior." \
              --target "$GITHUB_SHA"
          fi

          if gh release view apk-mais-recente > /dev/null 2>&1; then
            gh release upload apk-mais-recente "$LATEST" --clobber
            gh release edit apk-mais-recente --title "Gluco Cris - mais recente (v${VERSION} build ${GITHUB_RUN_NUMBER})"
          else
            gh release create apk-mais-recente "$LATEST" \
              --title "Gluco Cris - mais recente (v${VERSION} build ${GITHUB_RUN_NUMBER})" \
              --notes "Sempre a versao mais nova: baixe GlucoCris-universal-latest.apk." \
              --target "$GITHUB_SHA"
          fi
