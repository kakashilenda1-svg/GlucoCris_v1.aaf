name: Build APK GlucoCris

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: glucocris-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  EXPECTED_APPLICATION_ID: com.agon.app

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:

      # 1. BAIXAR REPOSITORIO ATUALIZADO
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. IDENTIFICAR O ULTIMO PROJETO ENVIADO
      - name: Extract project
        id: p
        shell: bash
        run: |
          set -euo pipefail

          ARQUIVO=""

          mapfile -d '' FILES < <(
            git ls-files -z -- '*.aaf' '*.zip'
          )

          if [ "${#FILES[@]}" -gt 0 ]; then

            TMP="$RUNNER_TEMP/project-files.txt"
            : > "$TMP"

            for f in "${FILES[@]}"; do
              TS=$(git log -1 --format=%ct -- "$f")
              [ -n "$TS" ] || TS=0

              printf '%s\t%s\n' "$TS" "$f" >> "$TMP"
            done

            ARQUIVO=$(sort -t $'\t' -k1,1nr -k2,2r "$TMP" |
              head -1 | cut -f2-)

            echo "ULTIMO PROJETO ENVIADO: $ARQUIVO"

            rm -rf proj
            mkdir -p proj

            unzip -q "$ARQUIVO" -d proj

            SETTINGS=$(find proj -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) |
              sort | head -1)

            if [ -z "$SETTINGS" ]; then
              echo "::error::O arquivo mais recente nao contem settings.gradle."
              exit 1
            fi

            DIR=$(dirname "$SETTINGS")

          elif [ -f settings.gradle.kts ] || [ -f settings.gradle ]; then

            DIR="."
            ARQUIVO="Projeto na raiz do repositorio"

          else
            echo "::error::Nenhum projeto Android encontrado."
            exit 1
          fi

          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "source=$ARQUIVO" >> "$GITHUB_OUTPUT"

          rm -f "$DIR/local.properties"

          test -f "$DIR/app/build.gradle.kts" || \
          test -f "$DIR/app/build.gradle" || {
            echo "::error::app/build.gradle ausente."
            exit 1
          }

          echo "================================"
          echo "PROJETO SELECIONADO"
          echo "$ARQUIVO"
          echo "DIRETORIO: $DIR"
          echo "================================"

          grep -hE \
            "versionName|versionCode|applicationId|compileSdk" \
            "$DIR"/app/build.gradle* || true

          cat "$DIR/BUILD_STAMP.txt" 2>/dev/null || true

          GV=8.11.1

          if [ -f "$DIR/gradle/wrapper/gradle-wrapper.properties" ]; then
            DETECTED=$(sed -n \
              's/.*gradle-\(.*\)-bin\.zip/\1/p' \
              "$DIR/gradle/wrapper/gradle-wrapper.properties" |
              head -1)

            [ -n "$DETECTED" ] && GV="$DETECTED"
          fi

          echo "gv=$GV" >> "$GITHUB_OUTPUT"

          echo "Gradle: $GV"

          {
            echo "## Projeto selecionado"
            echo "- Arquivo: $ARQUIVO"
            echo "- Diretorio: $DIR"
            echo "- Gradle: $GV"
          } >> "$GITHUB_STEP_SUMMARY"

      # 3. INSTALAR JAVA
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 4. PREPARAR ANDROID SDK
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(command -v sdkmanager || \
              find "$ANDROID_HOME/cmdline-tools" \
              -name sdkmanager -type f | head -1)
          fi

          yes | "$SDKMANAGER" --licenses > /dev/null || true

          "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt2"
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"

      # 5. CONFIGURAR GRADLE
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.p.outputs.gv }}
          cache-disabled: true

      # 6. COMPILAR PROJETO SELECIONADO
      - name: Build universal APK
        id: build
        working-directory: ${{ steps.p.outputs.dir }}
        env:
          TAVILY_PROXY_URL: ${{ secrets.TAVILY_PROXY_URL }}
          TAVILY_APP_TOKEN: ${{ secrets.TAVILY_APP_TOKEN }}
        shell: bash
        run: |
          set -o pipefail

          echo "COMPILANDO PROJETO SELECIONADO:"
          echo "${{ steps.p.outputs.source }}"

          gradle :app:clean :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain \
            "-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8" \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      # 7. ENVIAR LOG SE HOUVER FALHA
      - name: Enviar log de build
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      # 8. VALIDAR APK E IDENTIFICAR VERSAO REAL
      - name: Prepare APK
        id: apk
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.p.outputs.dir }}
        run: |
          set -euo pipefail

          BT="$ANDROID_HOME/build-tools/36.0.0"

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f -name "*.apk" 2>/dev/null | head -1 || true)

          if [ -z "$APK" ]; then
            echo "::error::APK nao encontrado."
            exit 1
          fi

          SIZE=$(stat -c %s "$APK")

          echo "APK: $APK"
          echo "Tamanho: $SIZE bytes"

          [ "$SIZE" -gt 5000000 ] || {
            echo "::error::APK suspeito."
            exit 1
          }

          unzip -tq "$APK"

          "$BT/apksigner" verify --verbose "$APK"

          "$BT/aapt2" dump badging "$APK" > badging.txt

          PKG=$(sed -n \
            "s/^package: name='\([^']*\)'.*/\1/p" \
            badging.txt)

          VCODE=$(sed -n \
            "s/.*versionCode='\([^']*\)'.*/\1/p" \
            badging.txt | head -1)

          VNAME=$(sed -n \
            "s/.*versionName='\([^']*\)'.*/\1/p" \
            badging.txt | head -1)

          echo "APPLICATION ID: $PKG"
          echo "VERSION NAME: $VNAME"
          echo "VERSION CODE: $VCODE"

          [ "$PKG" = "$EXPECTED_APPLICATION_ID" ] || {
            echo "::error::applicationId incorreto: $PKG"
            exit 1
          }

          [ -n "$VNAME" ] || {
            echo "::error::versionName vazio."
            exit 1
          }

          cp "$APK" "$GITHUB_WORKSPACE/GlucoCris-universal.apk"

          echo "version=$VNAME" >> "$GITHUB_OUTPUT"
          echo "versionCode=$VCODE" >> "$GITHUB_OUTPUT"

          {
            echo "## APK gerado e validado"
            echo "| Campo | Valor |"
            echo "|---|---|"
            echo "| Projeto | ${{ steps.p.outputs.source }} |"
            echo "| Versao | $VNAME |"
            echo "| Version Code | $VCODE |"
            echo "| Tamanho | $(du -h "$APK" | cut -f1) |"
            echo "| Application ID | $PKG |"
            echo "| SHA-256 | $(sha256sum "$APK" | cut -d' ' -f1) |"
          } >> "$GITHUB_STEP_SUMMARY"

      # 9. GERAR ZIP DO MESMO PROJETO COMPILADO
      - name: Gerar ZIP do projeto atualizado
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.p.outputs.dir }}
        run: |
          set -euo pipefail

          OUT="$GITHUB_WORKSPACE/GlucoCris-projeto-atualizado.zip"

          rm -f "$OUT"

          cd "$PROJECT_DIR"

          zip -qr "$OUT" . \
            -x ".git/*" \
               "*/.git/*" \
               ".gradle/*" \
               "*/.gradle/*" \
               "build/*" \
               "*/build/*" \
               "local.properties" \
               "*/local.properties" \
               "GlucoCris-projeto-atualizado.zip"

          unzip -tq "$OUT"

          echo "ZIP DO PROJETO:"
          ls -lh "$OUT"

          {
            echo "## ZIP do projeto atualizado"
            echo "- Versao: ${{ steps.apk.outputs.version }}"
            echo "- Projeto original: ${{ steps.p.outputs.source }}"
            echo "- Arquivo: GlucoCris-projeto-atualizado.zip"
            echo "- Tamanho: $(du -h "$OUT" | cut -f1)"
            echo "- SHA-256: $(sha256sum "$OUT" | cut -d' ' -f1)"
          } >> "$GITHUB_STEP_SUMMARY"

      # 10. PUBLICAR APK E ZIP COMO ULTIMA RELEASE
      - name: Publicar APK e projeto ZIP
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: GlucoCris v${{ steps.apk.outputs.version }} (build ${{ github.run_number }})
          make_latest: true
          fail_on_unmatched_files: true

          body: |
            =====================================
                       GLUCOCRIS
            =====================================

            VERSAO ATUAL: v${{ steps.apk.outputs.version }}

            COMPILACAO: ${{ github.run_number }}

            VERSION CODE: ${{ steps.apk.outputs.versionCode }}

            PROJETO ORIGINAL:
            ${{ steps.p.outputs.source }}

            =====================================
                  ARQUIVOS DESTA VERSAO
            =====================================

            1. GlucoCris-universal.apk

               Aplicativo Android instalavel.
               Versao: v${{ steps.apk.outputs.version }}

            2. GlucoCris-projeto-atualizado.zip

               Projeto Android completo.
               Versao: v${{ steps.apk.outputs.version }}

            =====================================

            APK e ZIP foram gerados a partir do
            mesmo projeto selecionado nesta compilacao.

            Esta e a publicacao mais recente.

          files: |
            GlucoCris-universal.apk
            GlucoCris-projeto-atualizado.zip
