
name: Build APK GlucoCris

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: glucocris-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    permissions:
      contents: write

    steps:
      # 1. Baixar repositório
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Encontrar ou extrair projeto Android
      - name: Localizar projeto GlucoCris
        shell: bash
        run: |
          set -e

          SETTINGS=$(find . \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -not -path "./.git/*" \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "Projeto não encontrado diretamente."
            echo "Procurando arquivo ZIP..."

            EXTRACT_DIR="$GITHUB_WORKSPACE/.build-source"
            mkdir -p "$EXTRACT_DIR"

            FOUND=false

            while IFS= read -r -d '' ZIPFILE; do
              echo "Testando: $ZIPFILE"

              rm -rf "$EXTRACT_DIR"
              mkdir -p "$EXTRACT_DIR"

              if unzip -oq "$ZIPFILE" -d "$EXTRACT_DIR"; then
                SETTINGS=$(find "$EXTRACT_DIR" \
                  -type f \
                  \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
                  -not -path "*/.git/*" \
                  -print -quit)

                if [ -n "$SETTINGS" ]; then
                  FOUND=true
                  break
                fi
              fi
            done < <(find . -type f -iname "*.zip" \
              -not -path "./.git/*" -print0)

            if [ "$FOUND" != "true" ]; then
              echo "::error::Não foi encontrado projeto Gradle nem ZIP contendo o projeto."
              echo "Envie os arquivos extraídos ou coloque o ZIP no repositório."
              exit 1
            fi
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Projeto localizado: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "=== ESTRUTURA DO PROJETO ==="
          ls -la "$PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "::error::Arquivo app/build.gradle.kts não encontrado."
            exit 1
          fi

      # 3. Configurar Java
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 4. Configurar Android SDK
      - name: Preparar Android SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # 5. Instalar Gradle
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-disabled: true

      # 6. Compilar APK
      - name: Compilar GlucoCris
        id: build
        shell: bash
        env:
          TAVILY_PROXY_URL: ${{ secrets.TAVILY_PROXY_URL }}
          TAVILY_APP_TOKEN: ${{ secrets.TAVILY_APP_TOKEN }}
        run: |
          set -o pipefail

          gradle -p "$PROJECT_DIR" \
            :app:assembleDebug \
            --stacktrace \
            --console=plain \
            "-Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8" \
            2>&1 | tee build.log

      # 7. Resumo de erros
      - name: Resumo do erro
        if: failure() && steps.build.outcome == 'failure'
        shell: bash
        run: |
          {
            echo "## Erro na compilação"
            echo '```'

            if [ -f build.log ]; then
              grep -E '^e: |^\* What went wrong:|^Execution failed' \
                build.log | head -n 40 || true

              echo "--- Detalhes adicionais ---"
              grep -A12 '^\* What went wrong:' \
                build.log | head -n 20 || true
            fi

            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 8. Preparar APK
      - name: Preparar APK
        shell: bash
        run: |
          VERSION=$(sed -n \
            's/.*versionName = "\([^"]*\)".*/\1/p' \
            "$PROJECT_DIR/app/build.gradle.kts" | head -n 1)

          VERSION=${VERSION:-dev}

          APK_PATH="$PROJECT_DIR/app/build/outputs/apk/debug"

          APK=$(find "$APK_PATH" -type f -name "*.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "::error::Nenhum APK foi gerado."
            exit 1
          fi

          mkdir -p dist

          cp "$APK" "dist/GlucoCris-v${VERSION}.apk"

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          echo "APK pronto: GlucoCris-v${VERSION}.apk"

      # 9. Disponibilizar APK para download
      - name: Publicar Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlucoCris-v${{ env.VERSION }}-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      # 10. Publicar na aba Releases
      - name: Publicar APK em Releases
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="apk-mais-recente"
          APK="dist/GlucoCris-v${VERSION}.apk"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --title "Gluco Cris v${VERSION}" \
              --notes "APK gerado automaticamente pelo GitHub Actions." \
              --target "$GITHUB_SHA"
          fi
