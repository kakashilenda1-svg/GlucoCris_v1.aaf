name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find project
        id: p
        run: |
          DIR=\( (dirname " \)(find . -name 'settings.gradle*' | head -1)")
          echo "dir=$DIR" >> $GITHUB_OUTPUT
          echo "Project dir: $DIR"
          
          # Remove local.properties se existir
          rm -f "$DIR/local.properties"
          
          echo "--- Version no projeto ---"
          grep -rhE "versionName|versionCode" "$DIR"/app/build.gradle* || true
          
          # Detecta versão do Gradle
          V=$(sed -n 's/.*gradle-\(.*\)-bin\.zip/\1/p' "$DIR/gradle/wrapper/gradle-wrapper.properties" 2>/dev/null)
          echo "gv=${V:-8.11.1}" >> $GITHUB_OUTPUT

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.p.outputs.gv }}

      - name: Build universal APK
        working-directory: ${{ steps.p.outputs.dir }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare APK
        run: |
          APK=$(find . -path '*/build/outputs/apk/debug/*.apk' | head -1)
          echo "APK: $APK"
          cp "$APK" GlucoCris-universal.apk
          ls -lh GlucoCris-universal.apk

      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: GlucoCris build ${{ github.run_number }}
          body: Universal APK (funciona em todos os dispositivos). Baixe o GlucoCris-universal.apk e instale.
          files: GlucoCris-universal.apk
