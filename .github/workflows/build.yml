name: Build APK GlucoCris

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: glucocris-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    permissions:
      contents: write

    steps:
      # 1. Baixar repositório
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Encontrar ou extrair projeto Android
      - name: Localizar projeto GlucoCris
        shell: bash
        run: |
          set -e

          SETTINGS=$(find . \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -not -path "./.git/*" \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "Projeto não encontrado diretamente."
            echo "Procurando arquivo ZIP..."

            EXTRACT_DIR="$GITHUB_WORKSPACE/.build-source"
            mkdir -p "$EXTRACT_DIR"

            FOUND=false

            while IFS= read -r -d '' ZIPFILE; do
              echo "Testando: $ZIPFILE"

              rm -rf "$EXTRACT_DIR"
              mkdir -p "$EXTRACT_DIR"

              if unzip -oq "$ZIPFILE" -d "$EXTRACT_DIR"; then
                SETTINGS=$(find "$EXTRACT_DIR" \
                  -type f \
                  \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
                  -not -path "*/.git/*" \
                  -print -quit)

                if [ -n "$SETTINGS" ]; then
                  FOUND=true
                  break
                fi
              fi
            done < <(find . -type f -iname "*.zip" \
              -not -path "./.git/*" -print0)

            if [ "$FOUND" != "true" ]; then
              echo "::error::Não foi encontrado projeto Gradle nem ZIP contendo o projeto."
              echo "Envie os arquivos extraídos ou coloque o ZIP no repositório."
              exit 1
            fi
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Projeto localizado: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "=== ESTRUTURA DO PROJETO ==="
          ls -la "$PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "::error::Arquivo app/build.gradle.kts não encontrado."
            exit 1
          fi

          # Mostra a versão do BOM para diagnóstico
          echo "=== Compose BOM usado ==="
          grep -n "compose-bom" "$PROJECT_DIR/app/build.gradle.kts" || true

      # 3. Configurar Java
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 4. Android SDK: o runner ubuntu-24.04 ja traz o SDK instalado (ANDROID_HOME).
      #    NAO usar android-actions/setup-android: falha com o sdkmanager 16 ("Failed to find package 'tools'").
      - name: Preparar Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          fi
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      # 5. Instalar Gradle
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-disabled: true

      # 6. Compilar APK
      - name: Compilar GlucoCris
        id: build
        shell: bash
        env:
          TAVILY_PROXY_URL: ${{ secrets.TAVILY_PROXY_URL }}
          TAVILY_APP_TOKEN: ${{ secrets.TAVILY_APP_TOKEN }}
        run: |
          set -o pipefail

          echo "=== Gradle version ==="
          gradle --version

          echo "=== Conteúdo de $PROJECT_DIR ==="
          ls -la "$PROJECT_DIR"
          ls -la "$PROJECT_DIR/gradle/wrapper/" 2>/dev/null || true

          echo "=== Iniciando assembleDebug ==="
          gradle -p "$PROJECT_DIR" \
            :app:assembleDebug \
            --stacktrace \
            --console=plain \
            --no-daemon \
            "-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8" \
            2>&1 | tee build.log

      # 7. Resumo de erros (aparece no topo da execução como anotação vermelha)
      - name: Resumo do erro
        if: failure() && steps.build.outcome == 'failure'
        shell: bash
        run: |
          echo "========== ERROS REAIS DO BUILD =========="
          grep -E '^e: |^w: .*(error)|What went wrong|Execution failed|Caused by:|Could not |Duplicate class|Manifest merger|AAPT|error:' build.log \
            | grep -v '^\s*at ' | sort -u | head -n 40 | tee errors.txt
          echo "=========================================="
          while IFS= read -r line; do
            echo "::error::${line:0:400}"
          done < <(head -n 10 errors.txt)
          {
            echo "## Erro na compilação"
            echo '```'
            cat errors.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 7b. Guarda o log completo (baixe em "Artifacts" para copiar o erro real)
      - name: Enviar log de build
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      # 8. Preparar APK universal
      - name: Preparar APK
        if: success()
        shell: bash
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' "$PROJECT_DIR/app/build.gradle.kts" | head -n 1)
          VERSION=${VERSION:-1.0.0}
          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -type f -name "*.apk" -print -quit)
          if [ -z "$APK" ]; then
            echo "::error::Nenhum APK foi gerado."
            exit 1
          fi
          mkdir -p dist
          cp "$APK" "dist/GlucoCris-universal-v${VERSION}-build${GITHUB_RUN_NUMBER}.apk"
          cp "$APK" "dist/GlucoCris-universal-latest.apk"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          ls -lh dist

      # 9. Disponibilizar APK para download
      - name: Publicar Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GlucoCris-universal-v${{ env.VERSION }}-build${{ github.run_number }}
          path: dist/GlucoCris-universal-v*.apk
          if-no-files-found: error
          retention-days: 30

      # 10. Releases: (a) um release por build (historico de todas as atualizacoes)
      #                (b) "apk-mais-recente" sempre com o link fixo da versao mais nova
      - name: Publicar APK em Releases
        if: success()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSIONED="dist/GlucoCris-universal-v${VERSION}-build${GITHUB_RUN_NUMBER}.apk"
          LATEST="dist/GlucoCris-universal-latest.apk"

          gh release create "v${VERSION}-build${GITHUB_RUN_NUMBER}" "$VERSIONED" \
            --title "Gluco Cris v${VERSION} (build ${GITHUB_RUN_NUMBER})" \
            --notes "APK universal (arm64-v8a + x86_64). Instala por cima da versao anterior." \
            --target "$GITHUB_SHA"

          if gh release view apk-mais-recente >/dev/null 2>&1; then
            gh release delete-asset apk-mais-recente "GlucoCris-universal-latest.apk" -y 2>/dev/null || true
            gh release upload apk-mais-recente "$LATEST" --clobber
            gh release edit apk-mais-recente --title "Gluco Cris - mais recente (v${VERSION} build ${GITHUB_RUN_NUMBER})"
          else
            gh release create apk-mais-recente "$LATEST" \
              --title "Gluco Cris - mais recente (v${VERSION} build ${GITHUB_RUN_NUMBER})" \
              --notes "Sempre a versao mais nova. Baixe GlucoCris-universal-latest.apk." \
              --target "$GITHUB_SHA"
          fi
