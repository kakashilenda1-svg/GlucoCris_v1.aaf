name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract project
        id: p
        run: |
          set -e

          ARQUIVO=""
          MAX_VC=-1

          shopt -s nullglob
          for f in *.aaf *.zip *.aaf.zip; do
            [ -f "$f" ] || continue
            # ignora zips que nao parecem projeto android
            if ! unzip -l "$f" 2>/dev/null | grep -q 'settings.gradle'; then
              echo "ignorando (sem settings.gradle): $f"
              continue
            fi
            VC=$(unzip -p "$f" "app/build.gradle.kts" 2>/dev/null | \
                 grep -oE 'versionCode[[:space:]]*=[[:space:]]*[0-9]+' | \
                 head -1 | grep -oE '[0-9]+' || echo 0)
            echo "-> $f  (versionCode=$VC)"
            if [ "$VC" -gt "$MAX_VC" ]; then
              MAX_VC=$VC
              ARQUIVO="$f"
            fi
          done

          if [ -z "$ARQUIVO" ]; then
            echo "Nenhum .aaf/.zip com projeto Android encontrado"
            ls -la
            exit 1
          fi

          echo "Usando: $ARQUIVO (versionCode=$MAX_VC)"
          rm -rf proj
          mkdir -p proj
          unzip -q "$ARQUIVO" -d proj

          SETTINGS=$(find proj -name 'settings.gradle*' | head -1)
          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle* nao encontrado dentro de $ARQUIVO"
            find proj -maxdepth 4 -type f | head -50
            exit 1
          fi

          DIR=$(dirname "$SETTINGS")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Project dir: $DIR"

          rm -f "$DIR/local.properties"

          echo "--- Version no projeto ---"
          grep -rhE "versionName|versionCode" "$DIR"/app/build.gradle* || true

          # Lista wrapper (diagnostico)
          ls -la "$DIR/gradle/wrapper/" 2>/dev/null || echo "sem pasta gradle/wrapper"

          GV=8.11.1
          if [ -f "$DIR/gradle/wrapper/gradle-wrapper.properties" ]; then
            DETECTED=$(sed -n 's/.*gradle-\(.*\)-bin\.zip/\1/p' "$DIR/gradle/wrapper/gradle-wrapper.properties" | head -1)
            if [ -n "$DETECTED" ]; then
              GV="$DETECTED"
            fi
          fi
          echo "gv=$GV" >> "$GITHUB_OUTPUT"
          echo "Gradle: $GV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.p.outputs.gv }}

      - name: Build universal APK
        working-directory: ${{ steps.p.outputs.dir }}
        run: |
          # NAO usa ./gradlew (muitos .aaf nao tem gradle-wrapper.jar)
          # Usa o Gradle instalado pelo setup-gradle
          set +e
          gradle assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" -ne 0 ]; then
            {
              echo "## Erro do build (resumo)"
              echo '```'
              grep -nE "^e: |^FAILURE:|What went wrong|Execution failed|Duplicate class|requires libraries|minCompileSdk|Could not resolve|Could not find|AAPT:|error:|Manifest merger|Caused by:" "$GITHUB_WORKSPACE/build.log" | grep -v "at org.gradle" | head -60
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            MSG=$(grep -nE "^e: |What went wrong|Execution failed|Duplicate class|requires libraries|Could not resolve|Could not find|AAPT:|Manifest merger" "$GITHUB_WORKSPACE/build.log" | grep -v "at org.gradle" | head -12 | tr '\n' '|' | sed 's/%/%25/g')
            echo "::error title=Build falhou::${MSG}"
            exit "$STATUS"
          fi

      - name: Prepare APK
        run: |
          APK=$(find proj -path '*/build/outputs/apk/debug/*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "APK nao encontrado"
            find proj -path '*/build/outputs/*' | head -50
            exit 1
          fi
          echo "APK: $APK"
          cp "$APK" GlucoCris-universal.apk
          ls -lh GlucoCris-universal.apk

      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: GlucoCris build ${{ github.run_number }}
          body: |
            APK gerado a partir do .aaf com maior versionCode.
            Baixe GlucoCris-universal.apk e instale no celular.
          files: GlucoCris-universal.apk
