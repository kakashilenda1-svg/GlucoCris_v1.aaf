name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # também dá para rodar manualmente: aba Actions > Build APK > Run workflow

# Se você enviar vários arquivos em sequência, só o build mais recente continua rodando.
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write # necessário só para publicar o APK na aba Releases

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      # O repositório não traz gradle-wrapper.jar: usamos o mesmo Gradle do wrapper (8.11.1).
      # cache-provider: basic = cache gratuito (open source), vale para repositório público e privado.
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
          cache-provider: basic

      - name: Build universal APK
        id: build
        env:
          TAVILY_PROXY_URL: ${{ secrets.TAVILY_PROXY_URL }}
          TAVILY_APP_TOKEN: ${{ secrets.TAVILY_APP_TOKEN }}
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace --console=plain "-Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8" 2>&1 | tee build.log

      - name: Resumo do erro
        if: failure() && steps.build.outcome == 'failure'
        run: |
          grep -E '^e: ' build.log | sed -E 's#^e: file://.*/com/agon/app/##' | sed 's/%/%25/g' | head -n 10 | while IFS= read -r linha; do echo "::error title=Kotlin::$linha"; done
          {
            echo "## Erro do build (resumo)"
            echo '```'
            grep -E '^e: ' build.log | sed -E 's#^e: file://.*/com/agon/app/##' | head -n 30
            echo '--- outros ---'
            grep -E -A8 '^\* What went wrong:' build.log | head -n 25
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare APK
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          VERSION=${VERSION:-dev}
          mkdir -p dist
          cp "$(ls app/build/outputs/apk/debug/*.apk | head -n 1)" "dist/GlucoCris-v${VERSION}.apk"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Publish APK
        uses: actions/upload-artifact@v7
        with:
          name: GlucoCris-v${{ env.VERSION }}-apk
          path: dist/*.apk
          if-no-files-found: error

      # Extra: deixa o .apk pronto para baixar direto na aba Releases (se falhar, não derruba o build).
      - name: Publicar APK em Releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete apk-mais-recente --cleanup-tag --yes || true
          gh release create apk-mais-recente "dist/GlucoCris-v${VERSION}.apk" \
            --title "Gluco Cris v${VERSION} (build ${{ github.run_number }})" \
            --notes "APK gerado automaticamente pelo GitHub Actions (commit ${GITHUB_SHA::7})." \
            --target "$GITHUB_SHA"
