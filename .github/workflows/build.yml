name: Build APK GlucoCris

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: glucocris-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  EXPECTED_APPLICATION_ID: com.agon.app

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. Acha o projeto: na raiz do repo OU dentro do .zip/.aaf com a maior versionName.
      #    O zip GlucoCris_V6_4_entrega1_projeto.zip tem uma pasta (glucocris_v5/) dentro,
      #    entao o app/build.gradle.kts NAO fica na raiz do zip (o build antigo nao via isso).
      - name: Extract project
        id: p
        shell: bash
        run: |
          set -euo pipefail

          if [ -f settings.gradle.kts ] || [ -f settings.gradle ]; then
            echo "Projeto na raiz do repositorio."
            DIR="."
          else
            ARQUIVO=""
            BEST=""
            shopt -s nullglob
            for f in *.aaf *.zip *.aaf.zip; do
              [ -f "$f" ] || continue
              if ! unzip -l "$f" 2>/dev/null | grep -qE 'settings\.gradle(\.kts)?$'; then
                echo "ignorando (sem settings.gradle): $f"
                continue
              fi
              GRADLE_PATH=$(unzip -Z1 "$f" 2>/dev/null | grep -E '(^|/)app/build\.gradle(\.kts)?$' | head -1 || true)
              VN=""
              if [ -n "$GRADLE_PATH" ]; then
                VN=$(unzip -p "$f" "$GRADLE_PATH" 2>/dev/null | grep -oE 'versionName[[:space:]]*=[[:space:]]*"[^"]+"' | head -1 | sed -E 's/.*"([^"]+)"/\1/' || true)
              fi
              [ -n "$VN" ] || VN="0"
              echo "-> $f  (versionName=$VN)"
              if [ -z "$ARQUIVO" ] || [ "$(printf '%s\n%s\n' "$BEST" "$VN" | sort -V | tail -1)" = "$VN" ]; then
                BEST="$VN"
                ARQUIVO="$f"
              fi
            done

            if [ -z "$ARQUIVO" ]; then
              echo "::error::Nenhum .aaf/.zip com projeto Android encontrado"
              ls -la
              exit 1
            fi

            echo "Usando: $ARQUIVO (versionName=$BEST)"
            rm -rf proj
            mkdir -p proj
            unzip -q "$ARQUIVO" -d proj

            SETTINGS=$(find proj -maxdepth 4 -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -1)
            if [ -z "$SETTINGS" ]; then
              echo "::error::settings.gradle* nao encontrado dentro de $ARQUIVO"
              find proj -maxdepth 4 -type f | head -50
              exit 1
            fi
            DIR=$(dirname "$SETTINGS")
          fi

          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Project dir: $DIR"
          rm -f "$DIR/local.properties"

          test -f "$DIR/app/build.gradle.kts" || test -f "$DIR/app/build.gradle" || { echo "::error::app/build.gradle(.kts) ausente"; exit 1; }

          echo "--- Versao no projeto ---"
          grep -hE "versionName|versionCode|compileSdk|applicationId" "$DIR"/app/build.gradle* || true
          cat "$DIR/BUILD_STAMP.txt" 2>/dev/null || true

          # Versao do Gradle: a mesma do wrapper (fallback 8.11.1)
          GV=8.11.1
          if [ -f "$DIR/gradle/wrapper/gradle-wrapper.properties" ]; then
            DETECTED=$(sed -n 's/.*gradle-\(.*\)-bin\.zip/\1/p' "$DIR/gradle/wrapper/gradle-wrapper.properties" | head -1)
            [ -n "$DETECTED" ] && GV="$DETECTED"
          fi
          echo "gv=$GV" >> "$GITHUB_OUTPUT"
          echo "Gradle: $GV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt2"
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.p.outputs.gv }}
          cache-disabled: true

      - name: Build universal APK
        id: build
        working-directory: ${{ steps.p.outputs.dir }}
        env:
          TAVILY_PROXY_URL: ${{ secrets.TAVILY_PROXY_URL }}
          TAVILY_APP_TOKEN: ${{ secrets.TAVILY_APP_TOKEN }}
        run: |
          # Usa o Gradle instalado pelo setup-gradle (nao depende do gradlew)
          # GITHUB_RUN_NUMBER ja e lido pelo app/build.gradle.kts (versionCode = 1000 + run)
          set +e
          gradle :app:assembleDebug --no-daemon --stacktrace --console=plain \
            "-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8" 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" -ne 0 ]; then
            sed -E 's#file:///[^ ]*/app/src/main/java/com/agon/app/##' "$GITHUB_WORKSPACE/build.log" > "$GITHUB_WORKSPACE/build.short.log"
            {
              echo "## Erro do build (resumo)"
              echo '```'
              grep -E "^e: " "$GITHUB_WORKSPACE/build.short.log" | sed 's/^e: //' | fold -s -w 60 | head -150 || true
              echo '--- outros ---'
              grep -E "What went wrong|Execution failed|Duplicate class|requires libraries|Could not resolve|Could not find|AAPT:|Manifest merger" "$GITHUB_WORKSPACE/build.short.log" | grep -v "at org.gradle" | fold -s -w 60 | head -30 || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            MSG=$(grep -E "^e: " "$GITHUB_WORKSPACE/build.short.log" | sed 's/^e: //' | head -14 | tr '\n' '|' | sed 's/%/%25/g' || true)
            echo "::error title=Erros do Kotlin::${MSG}"
            exit "$STATUS"
          fi

      - name: Enviar log de build
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Prepare APK
        id: apk
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.p.outputs.dir }}
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -type f -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "::error::APK nao encontrado"
            find "$PROJECT_DIR" -path '*/build/outputs/*' | head -50
            exit 1
          fi
          SIZE=$(stat -c %s "$APK")
          echo "APK: $APK ($SIZE bytes)"
          [ "$SIZE" -gt 5000000 ] || { echo "::error::APK suspeito (menor que 5 MB)"; exit 1; }
          unzip -tq "$APK"
          "$BT/apksigner" verify --verbose "$APK" | head -n 8
          "$BT/aapt2" dump badging "$APK" > badging.txt
          PKG=$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" badging.txt)
          VCODE=$(sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" badging.txt | head -n 1)
          VNAME=$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" badging.txt | head -n 1)
          echo "applicationId=$PKG versionCode=$VCODE versionName=$VNAME"
          [ "$PKG" = "$EXPECTED_APPLICATION_ID" ] || { echo "::error::applicationId inesperado: $PKG"; exit 1; }
          [ -n "$VNAME" ] || { echo "::error::versionName vazio"; exit 1; }
          cp "$APK" "GlucoCris-universal.apk"
          echo "version=$VNAME" >> "$GITHUB_OUTPUT"
          {
            echo "## APK gerado e validado"
            echo "| Campo | Valor |"; echo "|---|---|"
            echo "| Tamanho | $(du -h "$APK" | cut -f1) |"
            echo "| applicationId | $PKG |"
            echo "| versionName / versionCode | $VNAME / $VCODE |"
            echo "| SHA-256 | $(sha256sum "$APK" | cut -d' ' -f1) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: GlucoCris v${{ steps.apk.outputs.version }} (build ${{ github.run_number }})
          body: |
            APK universal (arm64-v8a + x86_64) da versão ${{ steps.apk.outputs.version }}.
            Baixe GlucoCris-universal.apk e instale no celular (instala por cima da versão anterior).
          files: GlucoCris-universal.apk
