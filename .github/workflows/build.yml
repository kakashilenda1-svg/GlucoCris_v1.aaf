name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract project
        id: p
        run: |
          set -e

          # Escolhe o .aaf/.zip com maior versionCode (lendo dentro do arquivo)
          ARQUIVO=""
          MAX_VC=-1

          shopt -s nullglob
          for f in *.aaf *.zip *.aaf.zip; do
            [ -f "$f" ] || continue
            VC=$(unzip -p "$f" "app/build.gradle.kts" 2>/dev/null | \
                 grep -oE 'versionCode[[:space:]]*=[[:space:]]*[0-9]+' | \
                 head -1 | grep -oE '[0-9]+' || echo 0)
            echo "-> $f  (versionCode=$VC)"
            if [ "$VC" -gt "$MAX_VC" ]; then
              MAX_VC=$VC
              ARQUIVO="$f"
            fi
          done

          # Se nenhum tiver versionCode legível, pega o nome mais "novo" (sort -V)
          if [ -z "$ARQUIVO" ]; then
            ARQUIVO=$(ls -1 *.aaf *.zip 2>/dev/null | sort -V | tail -1 || true)
          fi

          if [ -z "$ARQUIVO" ] || [ ! -f "$ARQUIVO" ]; then
            echo "Nenhum .aaf/.zip encontrado na raiz do repositorio"
            ls -la
            exit 1
          fi

          echo "Usando: $ARQUIVO (versionCode=$MAX_VC)"
          rm -rf proj
          mkdir -p proj
          unzip -q "$ARQUIVO" -d proj

          SETTINGS=$(find proj -name 'settings.gradle*' | head -1)
          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle* nao encontrado dentro de $ARQUIVO"
            find proj -maxdepth 3 -type f | head -40
            exit 1
          fi

          DIR=$(dirname "$SETTINGS")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Project dir: $DIR"

          rm -f "$DIR/local.properties"

          echo "--- Version no projeto ---"
          grep -rhE "versionName|versionCode" "$DIR"/app/build.gradle* || true

          GV=8.11.1
          if [ -f "$DIR/gradle/wrapper/gradle-wrapper.properties" ]; then
            DETECTED=$(sed -n 's/.*gradle-\(.*\)-bin\.zip/\1/p' "$DIR/gradle/wrapper/gradle-wrapper.properties" | head -1)
            if [ -n "$DETECTED" ]; then
              GV="$DETECTED"
            fi
          fi
          echo "gv=$GV" >> "$GITHUB_OUTPUT"
          echo "Gradle: $GV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.p.outputs.gv }}

      - name: Build universal APK
        working-directory: ${{ steps.p.outputs.dir }}
        run: |
          chmod +x ./gradlew || true
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK
        run: |
          APK=$(find proj -path '*/build/outputs/apk/debug/*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "APK nao encontrado"
            find proj -path '*/build/outputs/*' | head -40
            exit 1
          fi
          echo "APK: $APK"
          cp "$APK" GlucoCris-universal.apk
          ls -lh GlucoCris-universal.apk

      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: GlucoCris build ${{ github.run_number }}
          body: |
            APK gerado a partir do .aaf/.zip com maior versionCode do repositorio.
            Baixe GlucoCris-universal.apk e instale no celular.
          files: GlucoCris-universal.apk
