name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find project
        id: p
        run: |
          set -e
          SETTINGS=$(find . -name 'settings.gradle*' | head -1)
          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle* nao encontrado"
            find . -maxdepth 3 -type f | head -50
            exit 1
          fi
          DIR=$(dirname "$SETTINGS")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Project dir: $DIR"

          rm -f "$DIR/local.properties"

          echo "--- Version no projeto ---"
          grep -rhE "versionName|versionCode" "$DIR"/app/build.gradle* || true

          GV=8.11.1
          if [ -f "$DIR/gradle/wrapper/gradle-wrapper.properties" ]; then
            DETECTED=$(sed -n 's/.*gradle-\(.*\)-bin\.zip/\1/p' "$DIR/gradle/wrapper/gradle-wrapper.properties" | head -1)
            if [ -n "$DETECTED" ]; then
              GV="$DETECTED"
            fi
          fi
          echo "gv=$GV" >> "$GITHUB_OUTPUT"
          echo "Gradle: $GV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.p.outputs.gv }}

      - name: Build universal APK
        working-directory: ${{ steps.p.outputs.dir }}
        run: |
          chmod +x ./gradlew || true
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK
        run: |
          APK=$(find . -path '*/build/outputs/apk/debug/*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "APK nao encontrado"
            find . -path '*/build/outputs/*' | head -40
            exit 1
          fi
          echo "APK: $APK"
          cp "$APK" GlucoCris-universal.apk
          ls -lh GlucoCris-universal.apk

      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: GlucoCris v1.26.0 build ${{ github.run_number }}
          body: |
            GlucoCris v1.26.0 (Cris Scanner)
            Baixe GlucoCris-universal.apk e instale no celular.
          files: GlucoCris-universal.apk
