name: Build APK GlucoCris

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: glucocris-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  EXPECTED_APPLICATION_ID: com.agon.app

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      # 1. Baixar o repositorio
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Encontrar e extrair o projeto Android
      - name: Extract project
        id: p
        shell: bash
        run: |
          set -euo pipefail

          if [ -f settings.gradle.kts ] || [ -f settings.gradle ]; then
            echo "Projeto encontrado na raiz."
            DIR="."
          else
            ARQUIVO=""
            BEST=""

            shopt -s nullglob

            for f in *.aaf *.zip; do
              [ -f "$f" ] || continue

              if ! unzip -l "$f" 2>/dev/null | grep -qE 'settings\.gradle(\.kts)?$'; then
                echo "Ignorando: $f"
                continue
              fi

              GRADLE_PATH=$(unzip -Z1 "$f" 2>/dev/null | grep -E '(^|/)app/build\.gradle(\.kts)?$' | head -1 || true)

              VN="0"

              if [ -n "$GRADLE_PATH" ]; then
                VN=$(unzip -p "$f" "$GRADLE_PATH" 2>/dev/null |
                  grep -oE 'versionName[[:space:]]*=[[:space:]]*"[^"]+"' |
                  head -1 |
                  sed -E 's/.*"([^"]+)"/\1/' || true)
              fi

              [ -n "$VN" ] || VN="0"

              echo "Arquivo: $f | Versao: $VN"

              if [ -z "$ARQUIVO" ] || [ "$(printf '%s\n%s\n' "$BEST" "$VN" | sort -V | tail -1)" = "$VN" ]; then
                BEST="$VN"
                ARQUIVO="$f"
              fi
            done

            if [ -z "$ARQUIVO" ]; then
              echo "::error::Nenhum projeto Android encontrado."
              ls -la
              exit 1
            fi

            echo "Projeto selecionado: $ARQUIVO"
            echo "Versao selecionada: $BEST"

            rm -rf proj
            mkdir -p proj
            unzip -q "$ARQUIVO" -d proj

            SETTINGS=$(find proj -maxdepth 4 -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -1)

            if [ -z "$SETTINGS" ]; then
              echo "::error::settings.gradle nao encontrado."
              exit 1
            fi

            DIR=$(dirname "$SETTINGS")
          fi

          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

          rm -f "$DIR/local.properties"

          test -f "$DIR/app/build.gradle.kts" || test -f "$DIR/app/build.gradle" || {
            echo "::error::Arquivo app/build.gradle ausente."
            exit 1
          }

          echo "--- Configuracao do projeto ---"
          grep -hE "versionName|versionCode|compileSdk|applicationId" "$DIR"/app/build.gradle* || true

          cat "$DIR/BUILD_STAMP.txt" 2>/dev/null || true

          GV=8.11.1

          if [ -f "$DIR/gradle/wrapper/gradle-wrapper.properties" ]; then
            DETECTED=$(sed -n 's/.*gradle-\(.*\)-bin\.zip/\1/p' "$DIR/gradle/wrapper/gradle-wrapper.properties" | head -1)
            [ -n "$DETECTED" ] && GV="$DETECTED"
          fi

          echo "gv=$GV" >> "$GITHUB_OUTPUT"

          echo "Gradle selecionado: $GV"

      # 3. Instalar Java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 4. Preparar Android SDK
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          fi

          yes | "$SDKMANAGER" --licenses > /dev/null || true

          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt2"
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"

      # 5. Configurar Gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.p.outputs.gv }}
          cache-disabled: true

      # 6. Compilar APK
      - name: Build universal APK
        id: build
        working-directory: ${{ steps.p.outputs.dir }}
        env:
          TAVILY_PROXY_URL: ${{ secrets.TAVILY_PROXY_URL }}
          TAVILY_APP_TOKEN: ${{ secrets.TAVILY_APP_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          gradle :app:assembleDebug --no-daemon --stacktrace --console=plain \
            "-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8" \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      # 7. Enviar log se houver falha
      - name: Enviar log de build
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      # 8. Validar APK
      - name: Prepare APK
        id: apk
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.p.outputs.dir }}
        run: |
          set -euo pipefail

          BT="$ANDROID_HOME/build-tools/36.0.0"

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -type f -name "*.apk" | head -1)

          if [ -z "$APK" ]; then
            echo "::error::APK nao encontrado."
            exit 1
          fi

          SIZE=$(stat -c %s "$APK")

          echo "APK encontrado: $APK"
          echo "Tamanho: $SIZE bytes"

          [ "$SIZE" -gt 5000000 ] || {
            echo "::error::APK suspeito."
            exit 1
          }

          unzip -tq "$APK"

          "$BT/apksigner" verify --verbose "$APK" | head -n 8

          "$BT/aapt2" dump badging "$APK" > badging.txt

          PKG=$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" badging.txt)

          VCODE=$(sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" badging.txt | head -1)

          VNAME=$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" badging.txt | head -1)

          echo "applicationId=$PKG"
          echo "versionCode=$VCODE"
          echo "versionName=$VNAME"

          [ "$PKG" = "$EXPECTED_APPLICATION_ID" ] || {
            echo "::error::applicationId incorreto: $PKG"
            exit 1
          }

          [ -n "$VNAME" ] || {
            echo "::error::versionName vazio."
            exit 1
          }

          cp "$APK" "$GITHUB_WORKSPACE/GlucoCris-universal.apk"

          echo "version=$VNAME" >> "$GITHUB_OUTPUT"

          {
            echo "## APK gerado e validado"
            echo "| Campo | Valor |"
            echo "|---|---|"
            echo "| Tamanho | $(du -h "$APK" | cut -f1) |"
            echo "| applicationId | $PKG |"
            echo "| versionName / versionCode | $VNAME / $VCODE |"
            echo "| SHA-256 | $(sha256sum "$APK" | cut -d' ' -f1) |"
          } >> "$GITHUB_STEP_SUMMARY"

      # 9. Gerar ZIP do projeto realmente utilizado na compilacao
      - name: Gerar ZIP do projeto atualizado
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.p.outputs.dir }}
        run: |
          set -euo pipefail

          OUT="$GITHUB_WORKSPACE/GlucoCris-projeto-atualizado.zip"

          rm -f "$OUT"

          cd "$PROJECT_DIR"

          zip -qr "$OUT" . \
            -x ".git/*" \
               "*/.git/*" \
               ".gradle/*" \
               "*/.gradle/*" \
               "build/*" \
               "*/build/*" \
               "local.properties" \
               "*/local.properties" \
               "GlucoCris-projeto-atualizado.zip"

          unzip -tq "$OUT"

          echo "ZIP criado e validado:"
          ls -lh "$OUT"

          echo "SHA-256:"
          sha256sum "$OUT"

          {
            echo "## Projeto Android completo"
            echo "- ZIP: GlucoCris-projeto-atualizado.zip"
            echo "- Tamanho: $(du -h "$OUT" | cut -f1)"
            echo "- SHA-256: $(sha256sum "$OUT" | cut -d' ' -f1)"
          } >> "$GITHUB_STEP_SUMMARY"

      # 10. Publicar APK e ZIP na mesma Release
      - name: Publicar APK e projeto ZIP
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: GlucoCris v${{ steps.apk.outputs.version }} (build ${{ github.run_number }})
          body: |
            GlucoCris - compilacao ${{ github.run_number }}

            Arquivos desta compilacao:

            1. GlucoCris-universal.apk
               Aplicativo Android instalavel.

            2. GlucoCris-projeto-atualizado.zip
               Projeto Android completo utilizado para gerar este APK.

            Ambos os arquivos pertencem a mesma compilacao.

          files: |
            GlucoCris-universal.apk
            GlucoCris-projeto-atualizado.zip
